<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Qonto → Resto TVA (montant au débit)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; line-height: 1.4; }
    .card { max-width: 980px; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    label { display:block; font-weight:600; margin-top:12px; }
    input, select, button, textarea { padding:10px; border-radius:10px; border:1px solid #ccc; font-size:14px; }
    button { cursor:pointer; }
    .muted { color:#666; font-size:13px; }
    .log { white-space: pre-wrap; background:#fafafa; border:1px solid #eee; padding:12px; border-radius:10px; margin-top:12px; }
    textarea { width:100%; min-height:140px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Qonto → Resto TVA + Compte (Web)</h1>
    <p class="muted">
      Export Qonto (TSV/Excel) → génère 3 blocs (banque / charge / TVA).<br>
      Montants toujours en <b>Débit</b> (colonne F). Tout reste dans ton navigateur.
    </p>

    <label>Charger un fichier (xlsx/xls/csv/txt)</label>
    <input id="file" type="file" accept=".xlsx,.xls,.csv,.txt" />

    <p class="muted">Ou colle directement ton export Qonto (format tabulé) :</p>
    <textarea id="paste" placeholder="Colle ici quelques lignes de l’export Qonto (TSV)"></textarea>

    <div class="row">
      <div style="min-width:220px; flex:1;">
        <label>Taux de TVA</label>
        <select id="taux">
          <option value="0">0%</option>
          <option value="5.5" selected>5,5%</option>
          <option value="10">10%</option>
          <option value="20">20%</option>
        </select>
      </div>

      <div style="min-width:220px; flex:1;">
        <label>Compte de charge</label>
        <input id="compte" type="text" value="6257000" />
      </div>

      <div style="min-width:220px; flex:1;">
        <label>Compte TVA</label>
        <input id="compteTVA" type="text" value="4456600" />
      </div>
    </div>

    <div class="row" style="margin-top:14px;">
      <button id="run" disabled>Transformer & télécharger</button>
    </div>

    <div id="log" class="log" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const logBox = $("log");

    function log(msg) { logBox.style.display = "block"; logBox.textContent += msg + "\\n"; }
    function resetLog() { logBox.textContent = ""; logBox.style.display = "none"; }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }

    function normalizeNumber(v) {
      if (v === null || v === undefined || v === "") return null;
      if (typeof v === "number") return Number.isFinite(v) ? v : null;
      const s = String(v).trim().replace(/\\s+/g, "").replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function parseTSV(text) {
      const lines = text.split(/\\r?\\n/).map(l => l.trimEnd()).filter(l => l.trim() !== "");
      if (lines.length === 0) return null;

      const splitLine = (line) => {
        if (line.includes("\\t")) return line.split("\\t");
        if (line.includes(";")) return line.split(";");
        if (line.includes(",")) return line.split(",");
        return line.split(/\\s+/);
      };

      return lines.map(l => {
        const r = splitLine(l);
        while (r.length < 9) r.push("");
        return r.slice(0, 9);
      });
    }

    // Colonnes (0-index) attendues:
    // 0 Date | 1 Journal | 2 Code | 3 Pièce | 4 Libellé | 5 Débit | 6 Crédit | 7 Statut | 8 (vide)
    //
    // Règle "montant au débit": on crée TTC = max(Débit, Crédit) et on met TTC en Débit, Crédit = vide.
    function transformQonto(rows, taux, compteCharge, compteTVA) {
      const n = rows.length;

      const base = rows.map(r => {
        const rr = Array.isArray(r) ? r.slice() : [];
        while (rr.length < 9) rr.push("");
        return rr.slice(0, 9);
      });

      // Nettoyage libellé: retire "CARTE"
      for (let i = 0; i < n; i++) {
        const lib = String(base[i][4] ?? "");
        base[i][4] = lib.replace(/CARTE\\s*/gi, "").trim();
      }

      // Journal = ac, pièce = TICKET
      for (let i = 0; i < n; i++) {
        base[i][1] = "ac";
        base[i][3] = "TICKET";
      }

      // TTC = max(Débit, Crédit) → tout en Débit
      const TTC = new Array(n).fill(0);
      for (let i = 0; i < n; i++) {
        const debit = normalizeNumber(base[i][5]) ?? 0;
        const credit = normalizeNumber(base[i][6]) ?? 0;
        const ttc = Math.max(debit, credit);
        TTC[i] = ttc;
        base[i][5] = ttc === 0 ? "" : ttc; // Débit
        base[i][6] = "";                  // Crédit vide
      }

      // I = 1,2,1,2...
      for (let i = 0; i < n; i++) base[i][8] = (i % 2 === 0) ? 1 : 2;

      const coef = (taux === 0) ? 1 : (1 + taux / 100);

      // Bloc CHARGE
      const charges = base.map(r => r.slice());
      for (let i = 0; i < n; i++) {
        charges[i][2] = compteCharge;
        const ttc = TTC[i];
        const ht = (taux === 0) ? ttc : (ttc / coef);
        charges[i][5] = ttc === 0 ? "" : ht; // Débit = HT
        charges[i][6] = "";
      }

      // Bloc TVA
      const tvaBloc = base.map(r => r.slice());
      for (let i = 0; i < n; i++) {
        tvaBloc[i][2] = compteTVA;
        const ttc = TTC[i];
        const ht = (taux === 0) ? ttc : (ttc / coef);
        const tva = (taux === 0) ? 0 : (ttc - ht);
        tvaBloc[i][5] = ttc === 0 ? "" : tva; // Débit = TVA
        tvaBloc[i][6] = "";
      }

      const out = [...base, ...charges, ...tvaBloc];

      // Tri sur I asc
      out.sort((a, b) => (normalizeNumber(a[8]) ?? 0) - (normalizeNumber(b[8]) ?? 0));

      return out;
    }

    let fileData = null;

    function enableRun() {
      const hasPaste = $("paste").value.trim().length > 0;
      $("run").disabled = !(hasPaste || fileData);
    }

    $("paste").addEventListener("input", () => { fileData = null; enableRun(); });

    $("file").addEventListener("change", async (e) => {
      resetLog();
      const f = e.target.files?.[0];
      if (!f) return;

      $("paste").value = "";
      $("run").disabled = true;
      log("Lecture du fichier…");

      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheetName = wb.SheetNames[0];
      assert(sheetName, "Aucune feuille trouvée.");
      const ws = wb.Sheets[sheetName];
      let rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });

      while (rows.length > 0) {
        const last = rows[rows.length - 1];
        const empty = !last || last.every(v => v === null || v === undefined || String(v).trim() === "");
        if (!empty) break;
        rows.pop();
      }
      assert(rows.length > 0, "Le fichier ne contient aucune ligne exploitable.");

      fileData = { rows, originalName: f.name, sheetName };
      log(`OK. ${rows.length} ligne(s) détectée(s) sur "${sheetName}".`);
      enableRun();
    });

    $("run").addEventListener("click", () => {
      try {
        resetLog();

        const taux = Number(String($("taux").value).replace(",", "."));
        const compte = $("compte").value.trim();
        const compteTVA = $("compteTVA").value.trim();

        assert([0, 5.5, 10, 20].includes(taux), "Taux TVA invalide.");
        assert(/^\\d{6,}$/.test(compte), "Compte charge invalide (>= 6 chiffres).");
        assert(/^\\d{6,}$/.test(compteTVA), "Compte TVA invalide (>= 6 chiffres).");

        let rows = null;
        const pasted = $("paste").value.trim();
        if (pasted.length > 0) {
          rows = parseTSV(pasted);
          assert(rows && rows.length > 0, "Collage inexploitable.");
          log(`Collage : ${rows.length} ligne(s).`);
        } else {
          assert(fileData, "Aucun fichier chargé.");
          rows = fileData.rows.map(r => {
            const rr = Array.isArray(r) ? r.slice() : [];
            while (rr.length < 9) rr.push("");
            return rr.slice(0, 9);
          });
          log(`Fichier : ${rows.length} ligne(s).`);
        }

        log("Transformation…");
        const outRows = transformQonto(rows, taux, compte, compteTVA);

        const outWb = XLSX.utils.book_new();
        const outWs = XLSX.utils.aoa_to_sheet(outRows);
        XLSX.utils.book_append_sheet(outWb, outWs, "RESULTAT");

        const baseName = (fileData?.originalName || "Qonto").replace(/\\.(xlsx|xls|csv|txt)$/i, "");
        const outName = `${baseName}_TRAITE_TVA_${String(taux).replace(".", "_")}.xlsx`;

        XLSX.writeFile(outWb, outName);

        log("Terminé ✅");
        log(`Taux: ${taux}% | Compte charge: ${compte} | Compte TVA: ${compteTVA}`);
        log(`Sortie: ${outRows.length} ligne(s).`);
      } catch (err) {
        alert(err?.message || String(err));
      }
    });

    enableRun();
  </script>
</body>
</html>
